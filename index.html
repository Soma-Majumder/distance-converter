<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Distance Converter</h1>

    <div class="field">
      <label for="km">Kilometers</label>
      <input type="number" id="km" placeholder="Enter kilometers" inputmode="decimal">
    </div>

    <div class="swap">⇅</div>

    <div class="field">
      <label for="miles">Miles</label>
      <input type="number" id="miles" placeholder="Enter miles" inputmode="decimal">
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
