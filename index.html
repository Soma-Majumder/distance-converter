<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="header">
      <span class="header-icon">🌍</span>
      <h1>Distance Converter</h1>
      <p class="subtitle">Kilometers ⇄ Miles</p>
    </div>

    <div class="field">
      <label for="km">Kilometers</label>
      <div class="input-group">
        <input type="number" id="km" placeholder="0" inputmode="decimal">
        <span class="unit">km</span>
      </div>
    </div>

    <div class="swap" aria-hidden="true">
      <span>⇅</span>
    </div>

    <div class="field">
      <label for="miles">Miles</label>
      <div class="input-group">
        <input type="number" id="miles" placeholder="0" inputmode="decimal">
        <span class="unit">mi</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
